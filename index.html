<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeakScore · agenda de publicação</title>
<!-- A pagina de onde o Eduardo posta. UM DIA POR VEZ: clica no dia na lateral e
     ve tudo daquele dia, a arte, a legenda pronta para copiar, os stories e o
     que precisa ser feito fora do feed. Os dados vivem em agenda-dados.js, e a
     contagem e CALCULADA la, nunca digitada.
     Servir da raiz do repo: http://localhost:8781/social/setembro-kit.html -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#F7F4EF;--paper:#FCFAF6;--ink:#0A0A08;--orange:#C2540A;--blue:#1B36DE;
  --peach:#FBE3CE;--line:rgba(10,10,8,.14);--t2:rgba(10,10,8,.72);--t3:rgba(10,10,8,.5)}
body{background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

/* ── lateral: a lista de dias ── */
.wrap{display:grid;grid-template-columns:266px 1fr;align-items:start;min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);
  padding:26px 16px 40px;background:var(--paper)}
nav .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding:0 8px}
nav .brand svg{width:22px;height:22px}
nav .brand b{font:900 22px 'Playfair Display',serif;letter-spacing:-.02em}
nav .brand b span{color:var(--orange)}
nav .mo{font:600 11px 'Space Grotesk';letter-spacing:.2em;text-transform:uppercase;color:var(--orange);
  margin:0 8px 16px}
.dia{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:8px;cursor:pointer;font:500 14px Inter;color:var(--ink);margin-bottom:2px}
.dia:hover{background:var(--cream)}
.dia.on{background:var(--ink);color:var(--paper)}
.dia.on .dsub{color:rgba(252,250,246,.6)}
.dnum{font:700 14px 'Space Grotesk';min-width:36px;flex:none}
.dtxt{flex:1;min-width:0}
.dsub{display:block;font:500 11px Inter;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#2E7D32}
.dot.warn{background:#C2540A}.dot.stop{background:#B3261E}.dot.none{background:rgba(10,10,8,.2)}
.legenda-dots{margin:16px 8px 0;padding-top:14px;border-top:1px solid var(--line);
  font:500 11px/1.9 Inter;color:var(--t3)}
.legenda-dots i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px}

/* ── o dia aberto ── */
main{padding:44px 52px 140px;max-width:1120px}
.hoje-tag{display:inline-block;font:700 11px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:5px;margin-bottom:14px}
h1{font:900 54px/1.05 'Playfair Display',serif;letter-spacing:-.03em;margin-bottom:8px}
h1 em{font-style:italic;color:var(--orange)}
.contagem{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.cnt{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 20px;min-width:152px}
.cnt b{display:block;font:900 38px 'Playfair Display',serif;color:var(--orange);line-height:1.05}
.cnt.sat b{color:var(--blue)}
.cnt span{font:600 10px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.ctx{background:var(--peach);border-radius:10px;padding:14px 20px;margin-top:14px;
  font:500 15px/1.5 Inter;color:var(--orange)}
.ctx b{font-weight:700}

section{margin-top:34px;padding-top:26px;border-top:2px solid var(--ink)}
h2{font:900 30px/1.15 'Playfair Display',serif;letter-spacing:-.02em;margin-bottom:4px}
.meta{font:600 11px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:16px}
.chip{display:inline-block;font:700 10px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border-radius:5px;margin-left:8px;vertical-align:4px}
.ok{background:#E4EFE4;color:#2E7D32}.warn{background:var(--peach);color:var(--orange)}
.stop{background:#F6DEDC;color:#B3261E}

.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px}
.strip figure{flex:none;width:186px;cursor:zoom-in}
.strip img{width:186px;aspect-ratio:4/5;display:block;background:#EFE9E0;object-fit:cover;
  border:1px solid rgba(10,10,8,.18);border-radius:3px;box-shadow:0 8px 20px -10px rgba(70,46,20,.45);
  transition:transform .12s}
.strip figure:hover img{transform:translateY(-3px)}
.strip .cap{font:600 10px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-top:7px}
.strip .cap a{color:var(--orange);text-decoration:none;margin-left:5px}
.clip video{width:186px;border-radius:3px;border:1px solid rgba(10,10,8,.18);display:block;background:#EFE9E0}

.two{display:grid;grid-template-columns:1fr 292px;gap:22px;align-items:start;margin-top:16px}
@media(max-width:1020px){.two{grid-template-columns:1fr}.wrap{grid-template-columns:1fr}nav{position:static;height:auto}}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.box h3{font:600 11px 'Space Grotesk';letter-spacing:.2em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.cap-text{font:400 16px/1.62 Inter;white-space:pre-wrap}
.sub{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lab{font:600 10px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.cta{font:600 16px/1.5 Inter}.cta b{color:var(--orange)}
.tags{font:400 15px/1.5 Inter;color:var(--t2)}
button{font:600 12px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 18px;margin-top:14px}
button:hover{background:var(--orange)}button.done{background:#2E7D32}
.side p{font:400 14px/1.55 Inter;color:var(--t2);margin-bottom:12px}
.side code{font:400 12px ui-monospace,Menlo,monospace;background:var(--cream);padding:2px 5px;border-radius:4px;word-break:break-all}
.side a{display:block;font:600 13px Inter;color:var(--orange);text-decoration:none;margin-top:3px}
.tarefas li{font:400 15px/1.6 Inter;margin:0 0 9px 18px}
.sto{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.sto .item{width:150px}
.sto figure{cursor:zoom-in}
.sto img{width:150px;aspect-ratio:9/16;object-fit:cover;display:block;border-radius:3px;
  border:1px solid rgba(10,10,8,.18);background:#EFE9E0}
.sto .nome{font:600 10px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-top:7px}
.sto .nome a{color:var(--orange);text-decoration:none;margin-left:5px}
.sto .faz{font:400 12px/1.5 Inter;color:var(--t2);margin-top:6px}
.vazio{font:400 17px/1.6 Inter;color:var(--t2);background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:22px 24px;margin-top:26px}

/* ── lupa ── */
#lb{position:fixed;inset:0;background:rgba(10,10,8,.92);display:none;z-index:99;align-items:center;justify-content:center;padding:28px}
#lb.on{display:flex}
#lb img{max-width:min(92vw,780px);max-height:80vh;object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.6)}
#lb .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:max-content;max-width:94vw;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(10,10,8,.86);
  border:1px solid rgba(252,250,246,.18);border-radius:999px;padding:10px 16px;
  font:600 13px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;color:rgba(252,250,246,.85)}
#lb .bar button{background:rgba(252,250,246,.16);color:#FCFAF6;margin:0;padding:9px 18px}
#lb .bar a{color:#F09E5A;text-decoration:none}
</style>
</head>
<body>
<div id="lb" role="dialog" aria-label="arte em tamanho grande">
  <img alt="">
  <div class="bar">
    <button data-lb="prev">anterior</button>
    <span data-lb="pos"></span>
    <a data-lb="dl" download>baixar png</a>
    <button data-lb="next">próxima</button>
    <button data-lb="close">fechar</button>
  </div>
</div>

<div class="wrap">
  <nav>
    <div class="brand">
      <svg viewBox="0 0 28 28" fill="none"><path d="M14 2L3 17.5H10.5V26L25 10.5H17.5L14 2Z" fill="#0A0A08"/></svg>
      <b>Peak<span>Score</span></b>
    </div>
    <div class="mo">agenda de publicação</div>
    <div id="lista"></div>
    <div class="legenda-dots">
      <div><i style="background:#2E7D32"></i>pronto para postar</div>
      <div><i style="background:#C2540A"></i>footage pronto, falta montar</div>
      <div><i style="background:#B3261E"></i>precisa de você</div>
    </div>
  </nav>
  <main id="dia"></main>
</div>

<script src="agenda-dados.js"></script>
<script>
const pad = (i) => String(i).padStart(2, '0');
const $ = (s) => document.querySelector(s);

function estado(dia) {
  if (!dia.post) return 'none';
  if (dia.post.bloqueado) return 'stop';
  if (dia.post.reel) return dia.post.clip ? 'warn' : 'stop';
  return 'ok';
}

const lista = $('#lista');
AGENDA.forEach((dia, i) => {
  const b = document.createElement('button');
  b.className = 'dia';
  b.innerHTML = `<span class="dot ${estado(dia)}"></span>
    <span class="dnum">${dia.curto}</span>
    <span class="dtxt">${dia.hoje ? '<b>hoje</b>' : dia.dow}
      <span class="dsub">${dia.post ? dia.post.titulo : 'sem post de feed'}</span></span>`;
  b.onclick = () => abrir(i);
  lista.appendChild(b);
});

const fig = (src, cap) =>
  `<figure data-full="${src}"><img src="${src}" alt="${cap}" loading="lazy">
     <div class="cap">${cap} <a href="${src}" download>baixar</a></div></figure>`;

function abrir(i) {
  document.querySelectorAll('.dia').forEach((b, k) => b.classList.toggle('on', k === i));
  const dia = AGENDA[i], p = dia.post;

  let art = '';
  if (p) {
    if (p.cards) {
      for (let k = 1; k <= p.cards; k++)
        art += fig(`carousel/out/${p.dir}/${pad(k)}.png`, `${k}. ${p.labels[k - 1]}`);
    } else {
      art += fig(`carousel/out/${p.dir}/${pad(p.n)}.png`, p.reel ? 'capa · vai no grid' : 'a arte');
      if (p.gancho) art += fig(`carousel/out/setembro-reels-ganchos/${pad(p.gancho)}.png`, 'gancho · frame 1');
    }
  }
  const chip = !p ? ''
    : p.bloqueado ? '<span class="chip stop">precisa de aluno autorizado</span>'
    : p.reel ? (p.clip ? '<span class="chip warn">footage pronto, falta montar</span>'
                       : '<span class="chip stop">precisa da sua câmera</span>')
    : '<span class="chip ok">pronto</span>';

  $('#dia').innerHTML = `
    ${dia.hoje ? '<div class="hoje-tag">Comece por aqui</div>' : ''}
    <h1><em>${dia.longo.split(',')[0]}</em>,${dia.longo.split(',')[1]}</h1>

    <div class="contagem">
      <div class="cnt"><b>${dia.enem}</b><span>dias · ENEM dia 1</span></div>
      <div class="cnt sat"><b>${dia.sat}</b><span>dias · SAT 7/11</span></div>
      <div class="cnt"><b>${dia.enem2}</b><span>dias · ENEM dia 2</span></div>
    </div>
    ${dia.contexto ? `<div class="ctx"><b>Acontece hoje:</b> ${dia.contexto}</div>` : ''}

    ${p ? `
    <section>
      <h2>${p.titulo}${chip}</h2>
      <div class="meta">${p.tipo}</div>
      <div class="strip">${art}</div>
      ${p.clip ? `<div class="strip"><figure class="clip">
          <video src="reels/out/${p.clip}.mp4" muted loop playsinline controls preload="metadata"></video>
          <div class="cap">${p.clip}.mp4 · app real, em português
            <a href="reels/out/${p.clip}.mp4" download>baixar</a></div></figure></div>` : ''}
      <div class="two">
        <div class="box">
          <h3>legenda</h3>
          <div class="cap-text" data-cap>${p.legenda}</div>
          <div class="sub"><div class="lab">CTA</div><div class="cta">${p.cta}</div></div>
          <div class="sub"><div class="lab">hashtags</div><div class="tags" data-tags>${p.tags}</div></div>
          <button data-copy>copiar legenda + hashtags</button>
        </div>
        <div class="side box">
          <div class="lab">nota de produção</div>
          <p>${p.nota}</p>
          <div class="lab">arquivos</div>
          <a href="carousel/out/${p.dir}/" target="_blank">abrir a pasta</a>
        </div>
      </div>
    </section>` : `<div class="vazio">Sem post de feed hoje.${dia.contexto ? '' : ' Dia de respiro.'}</div>`}

    ${dia.stories && dia.stories.length ? `
    <section>
      <h2>Stories</h2>
      <div class="meta">${dia.stories.length === 1 ? '1 story' : dia.stories.length + ' stories'} · nesta ordem</div>
      <div class="sto">${dia.stories.map((s) => `
        <div class="item">
          <figure data-full="carousel/out/${s.dir}/${pad(s.n)}.png">
            <img src="carousel/out/${s.dir}/${pad(s.n)}.png" alt="${s.o}" loading="lazy">
          </figure>
          <div class="nome">${s.o} <a href="carousel/out/${s.dir}/${pad(s.n)}.png" download>baixar</a></div>
          <div class="faz">${s.faz}</div>
        </div>`).join('')}</div>
    </section>` : ''}

    ${dia.tarefas && dia.tarefas.length ? `
    <section>
      <h2>Também hoje</h2>
      <div class="meta">fora do feed</div>
      <ul class="tarefas">${dia.tarefas.map((t) => `<li>${t}</li>`).join('')}</ul>
    </section>` : ''}`;

  window.scrollTo(0, 0);
}

/* ── lupa ── */
const lb = $('#lb'), lbImg = lb.querySelector('img');
const lbPos = lb.querySelector('[data-lb="pos"]'), lbDl = lb.querySelector('[data-lb="dl"]');
let grupo = [], at = 0;
function mostrar(i) {
  at = (i + grupo.length) % grupo.length;
  const src = grupo[at].dataset.full;
  lbImg.src = src; lbDl.href = src;
  lbPos.textContent = `${at + 1} de ${grupo.length}`;
  lb.classList.add('on');
}
const fechar = () => { lb.classList.remove('on'); lbImg.src = ''; };

document.addEventListener('click', (e) => {
  const fg = e.target.closest('figure[data-full]');
  if (fg && !e.target.closest('a')) {
    grupo = [...fg.closest('section').querySelectorAll('figure[data-full]')];
    return mostrar(grupo.indexOf(fg));
  }
  const nav = e.target.closest('[data-lb]');
  if (nav) {
    const k = nav.dataset.lb;
    if (k === 'next') mostrar(at + 1);
    else if (k === 'prev') mostrar(at - 1);
    else if (k === 'close') fechar();
    return;
  }
  if (e.target === lb) return fechar();

  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const box = b.closest('.box');
  const txt = box.querySelector('[data-cap]').textContent.trim() + '\n\n'
            + box.querySelector('[data-tags]').textContent.trim();
  navigator.clipboard.writeText(txt).then(() => {
    const old = b.textContent;
    b.textContent = 'copiado'; b.classList.add('done');
    setTimeout(() => { b.textContent = old; b.classList.remove('done'); }, 1600);
  });
});
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') fechar();
  if (e.key === 'ArrowRight' || e.key === 'Right') mostrar(at + 1);
  if (e.key === 'ArrowLeft' || e.key === 'Left') mostrar(at - 1);
});

abrir(0);
</script>
</body>
</html>
